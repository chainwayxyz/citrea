global:
  evaluation_interval: 15s
  scrape_interval: 15s
scrape_configs:
- job_name: prometheus
  relabel_configs:
  - replacement: dev-net
    source_labels:
    - __address__
    target_label: net_name
  - replacement: core
    source_labels:
    - __address__
    target_label: env_name
  - regex: .*
    replacement: dnc-prometheus
    source_labels:
    - __address__
    target_label: instance
  - regex: .*
    replacement: prometheus
    source_labels:
    - __address__
    target_label: service_name
  static_configs:
  - targets:
    - 127.0.0.1:9090
- job_name: citrea-full-node
  relabel_configs:
  - replacement: dev-net
    source_labels:
    - __address__
    target_label: net_name
  - replacement: core
    source_labels:
    - __address__
    target_label: env_name
  - regex: (.*)\.?:.*
    replacement: dnc-$1
    source_labels:
    - __address__
    target_label: instance
  - regex: (.*)\.?:.*
    replacement: $1
    source_labels:
    - __address__
    target_label: service_name
  - regex: (.*)\.citrea\.?:.*
    replacement: dnc-$1
    source_labels:
    - __address__
    target_label: instance
  - regex: (.*)\.citrea\.?:.*
    replacement: $1
    source_labels:
    - __address__
    target_label: service_name
  - regex: core-dev-net-(.*)\.citrea\.?:.*
    replacement: dnc-$1
    source_labels:
    - __address__
    target_label: instance
  - regex: core-dev-net-(.*)\.citrea\.?:.*
    replacement: $1
    source_labels:
    - __address__
    target_label: service_name
  scrape_interval: 1s
  static_configs:
  - targets:
    - host.docker.internal:8002
