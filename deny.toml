[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MITNFA",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
name = "ring"
# ring is derived from BoringSSL and has a bit of a special licensing situation,
# but we can effectively treat is as OpenSSL-like licensing.
expression = "OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources.allow-org]
github = [
  "paradigmxyz",
  # "alloy-rs",
  "chainwayxyz",
  "sp1-patches",
  "penumbra-zone",
]

[bans]
multiple-versions = "allow"
# We'd prefer to use Rustls instead of OpenSSL; this helps up from accidentally
# using OpenSSL. See <https://github.com/Sovereign-Labs/sovereign-sdk-wip/issues/352>.
deny = []

[advisories]
ignore = [
  "RUSTSEC-2024-0384", # Unmaintained instant crate
  "RUSTSEC-2024-0436", # Unmaintained paste crate
  "RUSTSEC-2025-0012", # Unmaintained backoff crate
  "RUSTSEC-2025-0141", # Ignore unmaintained bincode crate
  "RUSTSEC-2026-0009", # Ignore as no user input time present in project
  "RUSTSEC-2025-0137", # Ignore until it's fixed in upstream `alloy-primitives`. Though we shouldn't be affected.
  # TODO: Remove after reth upgrade unblocks aws-lc-sys >=0.38.0 and rustls-webpki >=0.103.10
  # None of these are reachable: Citrea doesn't use AES-CCM, PKCS7_verify, or CRL checking.
  "RUSTSEC-2026-0045", # aws-lc-sys: AES-CCM timing side-channel (not used by rustls)
  "RUSTSEC-2026-0046", # aws-lc-sys: PKCS7_verify cert chain bypass (not exposed via Rust API)
  "RUSTSEC-2026-0047", # aws-lc-sys: PKCS7_verify signature bypass (not exposed via Rust API)
  "RUSTSEC-2026-0048", # aws-lc-sys: CRL distribution point scope check (no CRL config in project)
  "RUSTSEC-2026-0049", # rustls-webpki: CRL DP matching logic (no CRL config in project)
  "RUSTSEC-2026-0098", # rustls-webpki: Name constraints for URI names were incorrectly accepted (we only use TLS as a client)
  "RUSTSEC-2026-0099", # rustls-webpki: Name constraints were accepted for certificates asserting a wildcard name (we only use TLS as a client)
  "RUSTSEC-2026-0104", # rustls-webpki: Reachable panic in certificate revocation list parsing (we only use TLS as a client)
  "RUSTSEC-2026-0002", # lru: IterMut violates Stacked Borrows by invalidating internal pointer)
  "RUSTSEC-2026-0119", # Ignore p2p related message encoding vulnerability. Bounded by reth v1.3.7 → hickory-resolver ^0.25. Used only as stub resolver for peer discovery. Remove when reth tag is bumped.
  "RUSTSEC-2026-0118", # Vulnerable code is behind the dnssec-ring/dnssec-aws-lc-rs feature, which is not enabled in our build. Bounded by reth v1.3.7 → hickory-resolver ^0.25. Remove when reth tag is bumped.
  # hickory-proto/hickory-resolver 0.25.2: fixes are in 0.26.x, bounded by reth v1.3.7 → reth-dns-discovery → hickory-resolver ^0.25.
  # Only reachable via reth_network::NetworkManager (DNS discovery), which nothing in our build constructs. Remove when reth tag is bumped.
  "RUSTSEC-2026-0487", # hickory-proto: panic on malformed SVCB/HTTPS `alpn` in zone text parsing (we never parse zone text)
  "RUSTSEC-2026-0489", # hickory-proto: panic on lone-quote SVCB/HTTPS param in zone text parsing (we never parse zone text)
  "RUSTSEC-2026-0490", # hickory-proto: zone file lexer panic on 4096+ char token (we never parse zone files)
  "RUSTSEC-2026-0491", # hickory-proto: memory amplification from DNS header record counts (resolver never instantiated)
  "RUSTSEC-2026-0504", # hickory-proto: DNSSEC NSEC3 comparison (dnssec-ring/dnssec-aws-lc-rs features not enabled)
  "RUSTSEC-2026-0505", # hickory-proto: DNSSEC NSEC3 owner names (dnssec features not enabled)
  "RUSTSEC-2026-0511", # hickory-proto: DNSSEC NXDOMAIN for empty non-terminal (dnssec features not enabled)
  "RUSTSEC-2026-0512", # hickory-proto: DNSSEC unrelated signed RRset (dnssec features not enabled)
  "RUSTSEC-2026-0514", # hickory-resolver: lookup returned records failing DNSSEC validation (dnssec features not enabled)
  "RUSTSEC-2026-0530", # hickory-proto: DNSSEC parent-side NSEC at zone cut (dnssec features not enabled)
  "RUSTSEC-2026-0531", # hickory-proto: DNSSEC child-side NSEC/NSEC3 for missing DS (dnssec features not enabled)
  "RUSTSEC-2026-0532", # hickory-proto: DNSSEC parent-side NSEC3 at zone cut (dnssec features not enabled)
  "RUSTSEC-2026-0549", # hickory-proto: DNSSEC NSEC3 NODATA at zone apex (dnssec features not enabled)
  "RUSTSEC-2026-0550", # hickory-proto: DNSSEC unsigned NSEC/NSEC3 in nonexistence proof (dnssec features not enabled)
  "RUSTSEC-2026-0551", # hickory-proto: DNSSEC non-IN class records marked secure (dnssec features not enabled)
  "RUSTSEC-2026-0173", # Ignore unmaintained proc-macro-error2
  "RUSTSEC-2026-0183", # git2: Remote::list() unsoundness. Build-time only (vergen-git2 embedding git info). Fix requires git2 >=0.21, bounded by reth v1.3.7 → vergen-git2. Remove when reth tag is bumped.
  "RUSTSEC-2026-0184", # git2: BlameHunk Signature unsoundness. Build-time only (vergen-git2 embedding git info). Fix requires git2 >=0.21, bounded by reth v1.3.7 → vergen-git2. Remove when reth tag is bumped.
  "RUSTSEC-2026-0220", # ruint: wrong overflow flag on Uint shifts. Fix needs ruint >=1.20.0, which requires unpinning serde =1.0.218 (alloy-consensus 0.13 uses serde::__private, removed in serde 1.0.220). We never call the affected APIs (checked/overflowing/saturating/strict shifts, to_base_be); revm guards SHL/SHR/SAR with `shift < 256` before using the plain operators.
  "RUSTSEC-2026-0253", # lru: unsound LruCache::pop() on a panicking key Drop. Our own lru is on 0.19.0 (sp1-prover on 0.18.5); the flagged copies are lru 0.12.5 (discv5 via reth v1.3.7) and lru 0.13.0 (alloy-provider 0.13.0). Needs catch_unwind around a pop with a panicking key Drop, which none of them do. Remove when reth and alloy are bumped.
  # TODO: Remove these rustls ignores when the TLS dependency chain can be upgraded.
  # rustls >=0.23.46 needs aws-lc-sys requiring cc >=1.2.26, blocked by reth v1.3.7's cc =1.2.15 pin;
  # rustls 0.21 also requires migrating the legacy AWS HTTP client dependencies.
  # Reassess if TLS providers, features, session stores, or endpoint policies change.
  "RUSTSEC-2026-0346", # Session Debug secrets: no custom session store or logging of affected session values; built-in cache Debug output is redacted.
  "RUSTSEC-2026-0348", # Certificate decompression DoS: rustls's non-default brotli feature is disabled, including with workspace --all-features.
  "RUSTSEC-2026-0349", # Accept key-share prediction risk: current clients use/prefer classical groups; we do not rely on post-quantum TLS protection. No authentication bypass or key compromise.
  "RUSTSEC-2026-0285", # Accept limited outbound TLS 1.3 handshake-metadata exposure: transcript authentication and application-data encryption remain intact.
  "RUSTSEC-2026-0382", # rustls-webpki 0.103.3 may accept distrusted emSign intermediates. Fix (>=0.103.16) is blocked by the same cc =1.2.15 pin. Our bundled webpki-roots 0.26.11/1.0.11 no longer ship the distrusted emSign roots (RUSTSEC-2026-0381).
  # crypto-bigint 0.5.5: the timing fix is only in >=0.7.6, which elliptic-curve 0.13 (k256/p256 via alloy, reth, SP1) cannot use.
  # Our direct use is bitcoin-da's U256 on public Bitcoin header/PoW data. The guests use the sp1-patches fork, which is not flagged.
  "RUSTSEC-2026-0387", # crypto-bigint: timing variability in operations meant to be constant-time. Remove when elliptic-curve moves to crypto-bigint >=0.7.6.
  # SP1 6.10.0 dependencies with no compatible fix. Remove when SP1 is upgraded.
  "RUSTSEC-2021-0139", # Ignore unmaintained ansi_term. tracing-forest 0.1.6 via SP1's slop-utils, node only (not in the guests), only formats log output.
  "RUSTSEC-2025-0119", # Ignore unmaintained number_prefix. indicatif 0.17 via sp1-prover, only formats progress output.
  # libsqlite3-sys 0.35.0 (bundled SQLite 3.50.2) comes from rusqlite 0.37 in sov-mock-da. The fix needs libsqlite3-sys >=0.39 (rusqlite >=0.41),
  # which needs cc >=1.2.27, blocked by reth v1.3.7's cc =1.2.15 pin. Mock DA only opens mock_da.db in its own configured data directory.
  "RUSTSEC-2026-0459", # libsqlite3-sys: bundled SQLite reads uninit page-cache memory from a crafted db/-wal pair. Remove when reth is bumped.
  # chrono/humantime were declared unmaintained with no fixed release. chrono is pulled in by SP1 (sp1-build, sp1-prover-types),
  # rolling-file and citrea-sequencer; humantime via reth v1.3.7 (humantime-serde). Unmaintained only, no known vulnerability.
  "RUSTSEC-2026-0543", # Ignore unmaintained chrono.
  "RUSTSEC-2026-0542", # Ignore unmaintained humantime (wraps chrono).
  "RUSTSEC-2026-0441", # Ignore unmaintained pin-utils. No fixed version exists; pulled in by the AWS SDK crates under sp1-sdk (aws-smithy-*).
]
unsound = "all"
