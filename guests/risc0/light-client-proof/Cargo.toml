[package]
name = "citrea-risc0-light-client"
version = "2.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
resolver = "2"

[build-dependencies]
risc0-build = { workspace = true, features = ["unstable"] }
citrea-risc0-batch-proof = { path = "../batch-proof" }

[package.metadata.risc0]
methods = ["bitcoin", "mock"]

[features]
bench = []
testing = ["citrea-risc0-batch-proof/testing"]

# Used indirectly to ensure batch-proof method IDs are built.
[package.metadata.cargo-udeps.ignore]
build = ["citrea-risc0-batch-proof"]
