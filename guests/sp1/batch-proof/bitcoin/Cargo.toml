[package]
name = "batch-proof-bitcoin"
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-only"
resolver = "2"

[workspace]

[dependencies]
sp1-zkvm = { version = "=6.10.0", features = ["verify"] }

bitcoin-da = { path = "../../../../crates/bitcoin-da", default-features = false }
citrea-primitives = { path = "../../../../crates/primitives" }
citrea-sp1 = { path = "../../../../crates/sp1" }
citrea-stf = { path = "../../../../crates/citrea-stf" }
const-hex = "1.14"
sov-modules-api = { path = "../../../../crates/sovereign-sdk/module-system/sov-modules-api", default-features = false }
sov-modules-stf-blueprint = { path = "../../../../crates/sovereign-sdk/module-system/sov-modules-stf-blueprint" }
sov-rollup-interface = { path = "../../../../crates/sovereign-sdk/rollup-interface" }
sov-state = { path = "../../../../crates/sovereign-sdk/module-system/sov-state" }

[features]
testing = ["citrea-primitives/testing"]

[profile.release]
debug = 0
lto = true
opt-level = 3
codegen-units = 1

# Guest-only SP1 crypto acceleration; see docs/sp1-precompiles.md.
[patch.crates-io]
crypto-bigint = { package = "crypto-bigint", git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.10.0" }
p256 = { package = "p256", git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }
sha3 = { package = "sha3", git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.10.0" }
substrate-bn = { package = "substrate-bn", git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-6.10.0-substrate-bn" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.10.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
secp256k1_29 = { package = "secp256k1", git = "https://github.com/sp1-patches/rust-secp256k1", tag = "patch-0.29.1-sp1-6.10.0" }
secp256k1_30 = { package = "secp256k1", git = "https://github.com/sp1-patches/rust-secp256k1", tag = "patch-0.30.0-sp1-6.10.0" }

# Both secp256k1 API versions use the same native ABI. Share the registry sys
# crate rather than linking one copy from each patched Git revision.
[patch."https://github.com/sp1-patches/rust-secp256k1"]
secp256k1-sys = { version = "=0.10.1" }
