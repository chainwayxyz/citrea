[package]
name = "citrea-sp1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
borsh.workspace = true
citrea-common = { path = "../common", optional = true }
metrics = { workspace = true, optional = true }
sov-rollup-interface = { path = "../sovereign-sdk/rollup-interface" }
sp1-sdk = { workspace = true, optional = true }
sp1-zkvm.workspace = true
tokio = { workspace = true, optional = true }
# Match the SDK's tonic version and TLS features, so RPC statuses can be downcast and the
# network's PROVE price read over the SDK's transport.
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true

[[example]]
name = "network_proof"
required-features = ["native"]

[features]
default = []
native = [
  "dep:sp1-sdk",
  "dep:citrea-common",
  "dep:metrics",
  "dep:tokio",
  "dep:uuid",
  "dep:async-trait",
  "dep:bincode",
  "dep:tonic",
  "dep:tracing",
  "sov-rollup-interface/native",
]
