name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-draft-release:
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Release ${{ github.ref_name }}

  upload-release-signatures:
    needs: create-draft-release
    runs-on: ubicloud-standard-2
    environment: release-signing
    steps:
      - name: Awaiting Signature Upload
        run: echo "Please upload the signature files to the draft release, then approve this job."

  build-and-verify:
    needs: [create-draft-release, upload-release-signatures]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      AUTHORIZED_KEYS: >-
        7F52EC9A995025E87F3AF1200C17966C01E52A9A 
        CFF759A7C0EF99813BD1E6EE85CCAD8803F887A0 
        350B725CBA2D7EC3A1AD048C00980777D2839E81
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubicloud-standard-30
          - platform: linux-arm64
            runner: ubicloud-standard-30-arm
          - platform: osx-arm64
            runner: self-hosted-citrea-osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Download signatures from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          for BINARY in citrea citrea-cli; do
            # Fetches all matching signature files (e.g., appended with maintainer names)
            gh release download "$TAG" \
              -p "${BINARY}-${TAG}-${PLATFORM}*.asc" \
              -D sigs/
          done

          COUNT=$(ls sigs/*.asc 2>/dev/null | wc -l)
          if [[ "$COUNT" -ne 6 ]]; then
            echo "FAIL: Expected 6 signature files for ${PLATFORM} (3 per binary), found ${COUNT}."
            exit 1
          fi

      - name: Merge signatures
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for BINARY in citrea citrea-cli; do
            cat sigs/${BINARY}-${TAG}-${PLATFORM}*.asc \
                > "${BINARY}-${TAG}-${PLATFORM}.signatures.asc"
          done

      - name: Import authorized GPG keys
        run: |
          set -euo pipefail
          read -r -a KEYS <<< "$AUTHORIZED_KEYS"
          MAX_RETRIES=3
          for KEY in "${KEYS[@]}"; do
            for i in $(seq 1 $MAX_RETRIES); do
              
              # Fetch the key and store it in a variable first
              RESPONSE=$(curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${KEY}")
              
              # Ensure it's actually a GPG key, not an HTML error page
              if echo "$RESPONSE" | grep -q "BEGIN PGP PUBLIC KEY BLOCK"; then
                echo "$RESPONSE" | gpg --import
                echo "✓ Successfully imported key $KEY"
                break
              fi
              
              if [[ "$i" -eq "$MAX_RETRIES" ]]; then
                echo "FAIL: Could not download a valid key for $KEY from the keyserver"
                exit 1
              fi
              
              echo "Retrying in 5 seconds..."
              sleep 5
            done
          done

      - name: Verify signature issuers (Fail-fast pre-check)
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          read -r -a AUTHORIZED_KEY_LIST <<< "$AUTHORIZED_KEYS"
          
          check_issuer() {
            local SIG_FILE="$1"
            echo "=== Checking issuers in ${SIG_FILE} ==="
            
            # Extract issuer key IDs
            ISSUERS=$(gpg --list-packets "$SIG_FILE" | grep -o "issuer key ID [0-9A-Fa-f]*" | awk '{print $4}')     
          
            if [[ -z "$ISSUERS" ]]; then
              echo "FAIL: Could not extract issuer key ID from $SIG_FILE. Invalid signature format."
              exit 1
            fi
            
            for ISSUER in $ISSUERS; do
              # Added '|| true' to prevent pipefail from crashing the script on exit code 2
              PRIMARY_FPR=$(gpg --with-colons --list-keys "$ISSUER" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}' || true)
              
              if [[ -z "$PRIMARY_FPR" ]]; then
                echo "FAIL: Signature belongs to Key ID $ISSUER, but this key is NOT in the local keyring!"
                echo "Either the import step failed, or the release was signed by a different key."
                exit 1
              fi
              
              AUTHORIZED=false
              for AUTH_FPR in "${AUTHORIZED_KEY_LIST[@]}"; do
                if [[ "$PRIMARY_FPR" == "$AUTH_FPR" ]]; then
                  AUTHORIZED=true
                  break
                fi
              done
              
              if ! $AUTHORIZED; then
                echo "FAIL: Unauthorized key ($PRIMARY_FPR) signed the release! Aborting build."
                exit 1
              fi
              echo "✓ Pre-check passed: Issuer $ISSUER maps to authorized primary key $PRIMARY_FPR"
            done
          }
          
          check_issuer "citrea-${TAG}-${PLATFORM}.signatures.asc"
          check_issuer "citrea-cli-${TAG}-${PLATFORM}.signatures.asc"

      - name: Build
        run: nix build ./nix#citrea

      - name: Rebuild to verify reproducibility
        run: nix build ./nix#citrea --rebuild

      - name: Verify merged signatures against binaries
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          read -r -a AUTHORIZED_KEY_LIST <<< "$AUTHORIZED_KEYS"

          verify_binary() {
            local BINARY_NAME="$1"
            local BINARY_PATH="$2"
            local MERGED="${BINARY_NAME}-${TAG}-${PLATFORM}.signatures.asc"

            echo "=== Verifying ${BINARY_NAME} against binary content ==="

            set +e
            SIG_STATUS=$(gpg --status-fd 1 --verify "$MERGED" "$BINARY_PATH")
            GPG_EXIT=$?
            set -e

            if [[ "$GPG_EXIT" -ne 0 ]] && ! echo "$SIG_STATUS" | grep -q "VALIDSIG"; then
              echo "$SIG_STATUS"
              echo "FAIL: gpg verification exited with code $GPG_EXIT and no valid signatures found for ${BINARY_NAME}."
              exit 1
            fi

            if echo "$SIG_STATUS" | grep -q "BADSIG"; then
              echo "FAIL: BAD signature detected for ${BINARY_NAME} — binary mismatch or tampering."
              exit 1
            fi

            local VALID_COUNT=0
            local SEEN_KEYS_STR=""

            while IFS= read -r line; do
              if echo "$line" | grep -q "VALIDSIG"; then
                SUBKEY_FPR=$(echo "$line" | awk '{print $3}')
                PRIMARY_FPR=$(gpg --with-colons --list-keys "$SUBKEY_FPR" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')

                AUTHORIZED=false
                for AUTH_FPR in "${AUTHORIZED_KEY_LIST[@]}"; do
                  if [[ "$PRIMARY_FPR" == "$AUTH_FPR" ]]; then
                    AUTHORIZED=true
                    break
                  fi
                done

                if ! $AUTHORIZED; then
                  echo "FAIL: Unauthorized key signed ${BINARY_NAME}: $PRIMARY_FPR"
                  exit 1
                fi

                if [[ "$SEEN_KEYS_STR" != *"$PRIMARY_FPR"* ]]; then
                  VALID_COUNT=$((VALID_COUNT + 1))
                  SEEN_KEYS_STR="$SEEN_KEYS_STR $PRIMARY_FPR"
                  echo "✓ $PRIMARY_FPR signature perfectly matches binary content"
                fi
              fi
            done <<< "$SIG_STATUS"

            echo "-----------------------------------"
            echo "Authorized signatures verified: $VALID_COUNT / 3"

            if [[ "$VALID_COUNT" -lt 3 ]]; then
              echo "FAIL: All 3 authorized signers required for ${BINARY_NAME}. Got $VALID_COUNT."
              exit 1
            fi

            echo "All signatures verified for ${BINARY_NAME} on ${PLATFORM}."
          }

          verify_binary "citrea"     "./result/bin/citrea"
          verify_binary "citrea-cli" "./result/bin/citrea-cli"

      - name: Collect artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp ./result/bin/citrea     "artifacts/citrea-${TAG}-${PLATFORM}"
          cp ./result/bin/citrea-cli "artifacts/citrea-cli-${TAG}-${PLATFORM}"
          cp "citrea-${TAG}-${PLATFORM}.signatures.asc"     artifacts/
          cp "citrea-cli-${TAG}-${PLATFORM}.signatures.asc" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: artifacts/

  package-and-publish:
    needs: build-and-verify
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-build-*-${{ github.ref_name }}
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          (cd artifacts && sha256sum \
            "citrea-${TAG}-linux-amd64" \
            "citrea-${TAG}-linux-arm64" \
            "citrea-${TAG}-osx-arm64" \
            "citrea-cli-${TAG}-linux-amd64" \
            "citrea-cli-${TAG}-linux-arm64" \
            "citrea-cli-${TAG}-osx-arm64" \
            > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: Release ${{ github.ref_name }} — Verified
          body: |
            This release has been cryptographically verified.
            All 3 authorized maintainers independently built and signed both `citrea` and `citrea-cli` for each platform via reproducible builds.

            Includes:
            - citrea-${{ github.ref_name }}-linux-amd64
            - citrea-${{ github.ref_name }}-linux-arm64
            - citrea-${{ github.ref_name }}-osx-arm64
            - citrea-cli-${{ github.ref_name }}-linux-amd64
            - citrea-cli-${{ github.ref_name }}-linux-arm64
            - citrea-cli-${{ github.ref_name }}-osx-arm64
            - Per-platform merged `.signatures.asc` files for both binaries
            - SHA256SUMS.txt
          files: |
            artifacts/citrea-${{ github.ref_name }}-linux-amd64
            artifacts/citrea-${{ github.ref_name }}-linux-arm64
            artifacts/citrea-${{ github.ref_name }}-osx-arm64
            artifacts/citrea-cli-${{ github.ref_name }}-linux-amd64
            artifacts/citrea-cli-${{ github.ref_name }}-linux-arm64
            artifacts/citrea-cli-${{ github.ref_name }}-osx-arm64
            artifacts/citrea-${{ github.ref_name }}-linux-amd64.signatures.asc
            artifacts/citrea-${{ github.ref_name }}-linux-arm64.signatures.asc
            artifacts/citrea-${{ github.ref_name }}-osx-arm64.signatures.asc
            artifacts/citrea-cli-${{ github.ref_name }}-linux-amd64.signatures.asc
            artifacts/citrea-cli-${{ github.ref_name }}-linux-arm64.signatures.asc
            artifacts/citrea-cli-${{ github.ref_name }}-osx-arm64.signatures.asc
            artifacts/SHA256SUMS.txt

  update-dockerhub:
    needs: package-and-publish
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-build-*-${{ github.ref_name }}
          path: artifacts
          merge-multiple: true

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          RELEASE="${{ github.ref_name }}"
          cp "artifacts/citrea-${RELEASE}-linux-amd64" docker/full-node/citrea-amd64
          cp "artifacts/citrea-${RELEASE}-linux-arm64" docker/full-node/citrea-arm64
          chmod +x docker/full-node/citrea-amd64 docker/full-node/citrea-arm64

          mkdir -p docker/full-node/genesis
          cp -r resources/genesis/mainnet docker/full-node/genesis/
          cp -r resources/genesis/testnet docker/full-node/genesis/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKERHUB_REPOSITORY: citrea-full-node
        with:
          context: docker/full-node/
          file: docker/full-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22

      - name: Sign Docker image
        shell: bash
        env:
          IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/citrea-full-node@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE_REF}"
          
          echo "Waiting for Docker Hub API to propagate the signature tag..."
          sleep 15

      - name: Verify signed Docker image
        shell: bash
        env:
          IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/citrea-full-node@${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-github-workflow-ref "${{ github.ref }}" \
            --certificate-github-workflow-sha "${{ github.sha }}"

      - name: Verify pushed manifest
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/citrea-full-node:${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}"