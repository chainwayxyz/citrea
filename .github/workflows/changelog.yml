name: Changelog Check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  check-changelog:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    name: Check Changelog Entry
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info for comment events
        if: github.event_name == 'issue_comment'
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Checkout PR head for comment events
        if: github.event_name == 'issue_comment'
        run: |
          git fetch origin ${{ steps.pr-info.outputs.head_sha }}
          git checkout ${{ steps.pr-info.outputs.head_sha }}

      - name: Check if CHANGELOG.md was modified
        id: changelog-check
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || steps.pr-info.outputs.base_ref }}"
          git fetch origin $BASE_REF
          if git diff --name-only origin/$BASE_REF...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "modified=true" >> $GITHUB_OUTPUT
          else
            echo "modified=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for dismissal comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body.toLowerCase();
            const isDismissal = commentBody.includes('skip-changelog') ||
                               commentBody.includes('no changelog') ||
                               commentBody.includes('/skip-changelog');

            if (isDismissal) {
              // Find and delete the bot's warning comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Changelog entry missing')
              );

              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id
                });

                // React to the user's comment
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: '+1'
                });
              }
            }

      - name: Comment if changelog is missing
        if: |
          github.event_name == 'pull_request' &&
          steps.changelog-check.outputs.modified == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;

            // Check if bot already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Changelog entry missing')
            );

            // Only comment if we haven't already
            if (!botComment) {
              const commentBody = `## Changelog entry missing

            No changes detected in \`CHANGELOG.md\`.

            **Recommendation:**
            \`\`\`
            ${prTitle}
            \`\`\`

            **To dismiss:** Reply with \`/skip-changelog\` in any comment.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }

      - name: Remove comment if changelog was added
        if: |
          github.event_name == 'pull_request' &&
          steps.changelog-check.outputs.modified == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Changelog entry missing')
            );

            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id
              });
            }