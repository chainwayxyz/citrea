name: Reproducible Build

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - "v*.*.*"
    # TODO: remove before merging.
    branches:
      - feat/repr-build
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubicloud-standard-30-ubuntu-2204
          - platform: linux-arm64
            runner: ubicloud-standard-30-arm-ubuntu-2204
          - platform: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.platform }}-${{ hashFiles('nix/flake.lock', 'nix/flake.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.platform }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ matrix.platform }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build
        run: nix build ./nix#citrea

      - name: Rebuild to verify reproducibility
        run: nix build ./nix#citrea --rebuild

      - name: Hash binaries
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          CITREA_HASH=$(shasum -a 256 ./result/bin/citrea | awk '{print $1}')
          CLI_HASH=$(shasum -a 256 ./result/bin/citrea-cli | awk '{print $1}')
          echo "citrea_hash=$CITREA_HASH" >> "$GITHUB_OUTPUT"
          echo "cli_hash=$CLI_HASH" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.platform }}"
            echo ""
            echo "| Binary | SHA-256 |"
            echo "|--------|---------|"
            echo "| citrea | \`$CITREA_HASH\` |"
            echo "| citrea-cli | \`$CLI_HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO: Remove -reproducible suffix once we replace release workflow with this one. Kept to prevent collision
      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CITREA_PATH="artifacts/citrea-${{ github.ref_name }}-${{ matrix.platform }}-reproducible"
          CLI_PATH="artifacts/citrea-cli-${{ github.ref_name }}-${{ matrix.platform }}-reproducible"
          cp ./result/bin/citrea "$CITREA_PATH"
          cp ./result/bin/citrea-cli "$CLI_PATH"

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: artifacts/

      # TODO: Remove -reproducible suffix once we replace release workflow with this one. Kept to prevent collision
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/citrea-${{ github.ref_name }}-${{ matrix.platform }}-reproducible
            artifacts/citrea-cli-${{ github.ref_name }}-${{ matrix.platform }}-reproducible

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: reproducible-build-*-${{ github.ref_name }}
          path: artifacts
          merge-multiple: true

      # TODO: Remove -reproducible suffix once we replace release workflow with this one. Kept to prevent collision
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 \
            "citrea-${{ github.ref_name }}-linux-amd64-reproducible" \
            "citrea-${{ github.ref_name }}-linux-arm64-reproducible" \
            "citrea-${{ github.ref_name }}-osx-arm64-reproducible" \
            "citrea-cli-${{ github.ref_name }}-linux-amd64-reproducible" \
            "citrea-cli-${{ github.ref_name }}-linux-arm64-reproducible" \
            "citrea-cli-${{ github.ref_name }}-osx-arm64-reproducible" \
            > "SHA256SUMS.txt")
          cat "artifacts/SHA256SUMS.txt"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle artifacts/SHA256SUMS.txt.sigstore.json \
            artifacts/SHA256SUMS.txt

      - name: Verify signed SHA256SUMS.txt
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/reproducible-build.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify-blob artifacts/SHA256SUMS.txt \
            --bundle artifacts/SHA256SUMS.txt.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${{ github.repository }}" \
            --certificate-github-workflow-ref "${{ github.ref }}" \
            --certificate-github-workflow-sha "${{ github.sha }}"

      # TODO: Remove -reproducible suffix once we replace release workflow with this one. Kept to prevent collision
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sigstore.json
            artifacts/citrea-${{ github.ref_name }}-linux-amd64-reproducible
            artifacts/citrea-${{ github.ref_name }}-linux-arm64-reproducible
            artifacts/citrea-${{ github.ref_name }}-osx-arm64-reproducible
            artifacts/citrea-cli-${{ github.ref_name }}-linux-amd64-reproducible
            artifacts/citrea-cli-${{ github.ref_name }}-linux-arm64-reproducible
            artifacts/citrea-cli-${{ github.ref_name }}-osx-arm64-reproducible
